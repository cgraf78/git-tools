name: Tests

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@9e0d9c7492170350e48a23b6a47c1ef9ae9fa003
    with:
      matrix-set: full
      profiles: base,shellcheck
      test-command: test/run
