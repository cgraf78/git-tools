name: Tests

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@e3246b432e347b5c331940d41626cc7bda60b803
    with:
      matrix-set: full
      profiles: base,shellcheck
      test-command: test/run
