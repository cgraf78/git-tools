name: Tests

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@d0648a98a1585710edb5d1393af84e48025bcaa7
    with:
      matrix-set: full
      profiles: base,shellcheck
      test-command: test/run
